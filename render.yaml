services:
  - type: web
    name: portfolio-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@12.9.1 --activate && pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        value: tareq212adel@gmail.com
      - key: CONTACT_FROM_EMAIL
        value: onboarding@resend.dev
      - key: CONTACT_IP_SALT
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
